name: Deploy Apps to Vercel

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.app.name }} to Vercel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: ricozviz-web
            dir: apps/ricozviz-web-default
            project: viz

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      CI: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment information
        working-directory: ${{ matrix.app.dir }}
        run: |
          pnpm dlx vercel@latest pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="${{ secrets.VERCEL_PROJECT_ID || secrets.VERCEL_WEB_PROJECT_ID || matrix.app.project }}"

      - name: Build project artifacts
        working-directory: ${{ matrix.app.dir }}
        run: |
          pnpm dlx vercel@latest build \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="${{ secrets.VERCEL_PROJECT_ID || secrets.VERCEL_WEB_PROJECT_ID || matrix.app.project }}"

      - name: Deploy project artifacts to Vercel
        working-directory: ${{ matrix.app.dir }}
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=15
          PROJECT_TARGET="${{ secrets.VERCEL_PROJECT_ID || secrets.VERCEL_WEB_PROJECT_ID || matrix.app.project }}"

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "🚀 [Attempt $attempt/$MAX_RETRIES] Deploying to Vercel ($PROJECT_TARGET)..."
            
            DEBUG_FLAG=""
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              DEBUG_FLAG="--debug"
            fi

            if pnpm dlx vercel@latest deploy \
              --prebuilt \
              --archive=tgz \
              --prod \
              --yes \
              $DEBUG_FLAG \
              --token="$VERCEL_TOKEN" \
              --scope="$VERCEL_ORG_ID" \
              --project="$PROJECT_TARGET"; then
              echo "✅ Deployment successful on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "⚠️ Deployment attempt $attempt failed. Waiting ${RETRY_DELAY}s before retrying..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Vercel deployment failed after $MAX_RETRIES attempts."
          exit 1
