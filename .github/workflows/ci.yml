name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Shared Package
  # ============================================================
  shared:
    name: Shared Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check — shared
        working-directory: packages/shared
        run: npx tsc --noEmit

  # ============================================================
  # Backend (API)
  # ============================================================
  api:
    name: API (Express + TypeScript)
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint — api
        working-directory: apps/api
        run: npm run lint

      - name: Type check — api
        working-directory: apps/api
        run: npm run typecheck

      - name: Build — api
        working-directory: apps/api
        run: npm run build

  # ============================================================
  # Frontend (Next.js)
  # ============================================================
  web:
    name: Web (Next.js + TypeScript)
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint — web
        working-directory: apps/web
        run: npm run lint

      - name: Type check — web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build — web
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
