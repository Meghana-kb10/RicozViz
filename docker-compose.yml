# ========================================
# RicozViz — Docker Compose (Development)
# ========================================
# Start: docker compose up -d
# Stop:  docker compose down
# Logs:  docker compose logs -f
# ========================================

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: ricozviz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ricozviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ricozviz_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ricozviz_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ricozviz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ricozviz} -d ${POSTGRES_DB:-ricozviz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- pgAdmin (optional: database GUI for development) ----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ricozviz_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ricozviz.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ricozviz_pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

volumes:
  ricozviz_postgres_data:
    driver: local
  ricozviz_pgadmin_data:
    driver: local

networks:
  default:
    name: ricozviz_network
