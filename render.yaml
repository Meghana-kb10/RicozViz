services:
  # ============================================================
  # 1. RicozViz Express API Backend
  # ============================================================
  - type: web
    name: ricozviz-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build:api
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ricozviz-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGIN
        value: "*"

  # ============================================================
  # 2. RicozViz Next.js Web Frontend
  # ============================================================
  - type: web
    name: ricozviz-web
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:web
    startCommand: npm run start:web
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ricozviz-api
          property: host
          transformation: https://{value}

databases:
  # ============================================================
  # 3. RicozViz Managed PostgreSQL
  # ============================================================
  - name: ricozviz-postgres
    plan: free
    region: oregon
    databaseName: ricozviz_db
    user: ricozviz
    postgresMajorVersion: "16"
