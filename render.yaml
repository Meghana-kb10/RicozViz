# ==============================================================================
# Render Blueprint — RicozViz Backend API
# ==============================================================================
# Pair with:
#   - MongoDB Atlas (MONGODB_URI)
#   - Vercel (apps/ricozviz-customer & apps/ricozviz-admin)
# ==============================================================================

services:
  - type: web
    name: ricozviz-api
    branch: develop
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false # Paste your MongoDB Atlas connection string (including /ricozviz)
      - key: MONGODB_DB_NAME
        value: ricozviz
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: CREDENTIAL_ENC_KEY
        generateValue: true
      - key: CREDENTIAL_ENC_KEY_VERSION
        value: "1"
      - key: ACTIVE_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: WEB_APP_URL
        value: http://localhost:3001 # Update to your Customer Vercel URL after Step 3
      - key: CORS_ORIGIN
        value: http://localhost:3001,http://localhost:3002 # Update to <CUSTOMER_VERCEL_URL>,<ADMIN_VERCEL_URL> after deploying Vercel
      - key: ADMIN_SEED_EMAIL
        sync: false # Optional: set once to auto-create your first PLATFORM_ADMIN on boot
      - key: ADMIN_SEED_PASSWORD
        sync: false # Optional: 12+ chars with uppercase, lowercase, number, and symbol
